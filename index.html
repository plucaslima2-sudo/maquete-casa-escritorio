<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A29">
<meta name="robots" content="noindex, nofollow">
<title>Maquete Casa-Escritório</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prancha de arquiteto. Carimbo no topo, a maquete ocupa a folha, lista de cômodos na margem. */
:root{
  --bg:#E8EDF1; --surface:#F7F9FB; --ink:#14253A; --muted:#566779; --line:#C2CCD6;
  --accent:#0B6E8F; --accent-ink:#FFFFFF; --scene:#DFE6EC; --lot:#CDD6DE; --label-bg:rgba(247,249,251,.93);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A29; --surface:#15263A; --ink:#E6EEF5; --muted:#8FA3B8; --line:#2B4159;
    --accent:#5CC8E8; --accent-ink:#06202B; --scene:#0B1522; --lot:#1A2C42; --label-bg:rgba(21,38,58,.93);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A29; --surface:#15263A; --ink:#E6EEF5; --muted:#8FA3B8; --line:#2B4159;
  --accent:#5CC8E8; --accent-ink:#06202B; --scene:#0B1522; --lot:#1A2C42; --label-bg:rgba(21,38,58,.93);
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{
  height:100%; display:grid; gap:10px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(320px,1fr);
}
@media (min-width:900px){
  .carimbo,.tools{grid-column:1 / -1}
}

/* carimbo (title block) */
.carimbo{display:flex; flex-wrap:wrap; border:1px solid var(--line); background:var(--surface)}
.carimbo h1{
  margin:0; padding:8px 14px; font-family:var(--f-display); font-weight:700; font-size:26px; line-height:1.1;
  letter-spacing:.02em; text-transform:uppercase; flex:1 1 240px; text-wrap:balance; align-self:center;
}
.cell{padding:7px 14px; border-left:1px solid var(--line); flex:0 1 auto; min-width:0}
.cell b{display:block; font-family:var(--f-mono); font-weight:500; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.cell span{font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums}
@media (max-width:620px){
  .carimbo h1{flex-basis:100%; border-bottom:1px solid var(--line); font-size:22px}
  .cell{flex:1 1 30%; padding:6px 10px}
  .cell:first-of-type{border-left:0}
}

/* ferramentas */
.tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); background:var(--surface)}
.seg button, .tog{
  font:600 14px var(--f-body); color:var(--ink); background:transparent; border:0; padding:8px 14px; cursor:pointer; min-height:38px;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"], .tog[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.tog{border:1px solid var(--line); background:var(--surface)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* palco */
.stage{position:relative; border:1px solid var(--line); background:var(--scene); overflow:hidden; min-height:320px}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab}
.stage canvas:active{cursor:grabbing}
.labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.lb{
  position:absolute; left:0; top:0; white-space:nowrap; font:500 11px var(--f-mono); letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink); background:var(--label-bg); border:1px solid var(--line); padding:1px 5px; will-change:transform;
}
.lb.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.lb.mark{background:transparent; border:0; color:var(--muted); font-size:12px; letter-spacing:.2em}
.tour{position:absolute; left:10px; top:10px; right:10px; display:flex; align-items:center; gap:6px; z-index:3; pointer-events:none}
.tour[hidden]{display:none}
.tour button{pointer-events:auto; font:600 14px/1 var(--f-body); color:var(--ink); background:var(--label-bg); border:1px solid var(--line); padding:0 14px; min-height:42px; cursor:pointer}
.tour span{pointer-events:none; flex:0 1 auto; min-width:0; font:600 15px/1.2 var(--f-display); letter-spacing:.04em; text-transform:uppercase; color:var(--ink); background:var(--label-bg); border:1px solid var(--line); padding:11px 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.info .tog{margin-top:10px}
.hint{position:absolute; left:10px; bottom:8px; font:400 11px var(--f-mono); color:var(--muted); pointer-events:none}
.fail{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted)}

/* margem */
.side{display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0}
.info{border:1px solid var(--line); background:var(--surface); padding:12px 14px}
.info h2{margin:0; font-family:var(--f-display); font-weight:700; font-size:22px; line-height:1.15; text-transform:uppercase; letter-spacing:.02em}
.info .dims{font:500 13px var(--f-mono); color:var(--accent); font-variant-numeric:tabular-nums; margin-top:2px}
.info p{margin:8px 0 0; max-width:60ch}
.info .src{font:400 12px var(--f-mono); color:var(--muted)}
.rooms{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; min-width:0}
.rooms h3{flex:0 0 auto; margin:0; align-self:center; font:500 10px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding-right:2px}
.chip{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; font:500 13px var(--f-body); color:var(--ink);
  background:var(--surface); border:1px solid var(--line); padding:7px 10px; cursor:pointer; min-height:36px;
}
.chip i{width:10px; height:10px; border:1px solid var(--ink); flex:0 0 auto}
.chip[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.aviso{font-size:13px; color:var(--muted); margin:0; max-width:65ch}
@media (min-width:900px){
  .side{overflow-y:auto}
  .rooms{flex-wrap:wrap; overflow-x:visible}
  .rooms h3{flex-basis:100%; padding-top:4px}
}
.stage .info{position:absolute; left:10px; bottom:30px; z-index:3; max-width:min(340px, calc(100% - 20px)); background:var(--label-bg); padding:10px 12px}
.stage .info[hidden]{display:none}
.stage .info h2{font-size:18px}
.stage .info p{font-size:13px; margin-top:6px}
.tools > *{flex:0 0 auto}
.seg button, .tog{min-height:44px}
@media (max-width:620px){
  body{padding-block:8px}
  .app{gap:8px}
  .carimbo .cell{display:none}
  .carimbo h1{border-bottom:0; font-size:20px; padding:6px 12px}
  .tools{gap:6px}
  .seg{display:flex; flex:1 1 100%}
  .seg button{flex:1 1 0; padding-inline:4px}
  .tools > .tog{flex:1 1 0; padding-inline:4px; font-size:13px}
  .stage .info p{display:none}
  .stage .info{bottom:26px}
  .hint{font-size:10px}
}
</style>

</head>
<body>
<div class="app">
  <header class="carimbo">
    <h1>Maquete Casa-Escritório</h1>
    <div class="cell"><b>Fonte</b><span>desenhos + fotos da rua</span></div>
    <div class="cell"><b>Pavimentos</b><span>térreo + superior</span></div>
    <div class="cell"><b>Área interna</b><span id="areaTotal">≈ — m²</span></div>
    <div class="cell"><b>Medidas</b><span>estimadas</span></div>
  </header>

  <div class="tools">
    <div class="seg" role="group" aria-label="Pavimento">
      <button type="button" id="mFora" data-mode="fora" aria-pressed="true">Por fora</button>
      <button type="button" id="mTerreo" data-mode="terreo" aria-pressed="false">Térreo</button>
      <button type="button" id="mSup" data-mode="sup" aria-pressed="false">Superior</button>
      <button type="button" id="mBoth" data-mode="both" aria-pressed="false">Os dois</button>
    </div>
    <button type="button" class="tog" id="btnTour" aria-pressed="false">Entrar nos cômodos</button>
    <button type="button" class="tog" id="btnTop" aria-pressed="false">De cima</button>
    <button type="button" class="tog" id="btnNames" aria-pressed="true">Nomes</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Maquete 3D da casa, com térreo e pavimento superior"></canvas>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="tour" id="tour" hidden><button type="button" id="tPrev" aria-label="Cômodo anterior">◀</button><span id="tNome"></span><button type="button" id="tNext" aria-label="Próximo cômodo">▶</button><button type="button" id="tSair">Sair</button></div>
    <section class="info" id="info" aria-live="polite" hidden></section>
    <div class="hint">arraste para girar · pinça ou rolagem para aproximar · toque num cômodo para entrar</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function merge(list){
  var s = list.slice().sort(function(a,b){ return a[0]-b[0]; }), out = [];
  s.forEach(function(iv){
    var last = out[out.length-1];
    if (last && iv[0] <= last[1] + 0.001) last[1] = Math.max(last[1], iv[1]);
    else out.push([iv[0], iv[1]]);

function subtract(solid, holes){
  var out = solid.map(function(s){ return [s[0], s[1]]; });
  holes.forEach(function(h){

      if (h[1] <= s[0] || h[0] >= s[1]) { next.push(s); return; }
      if (h[0] > s[0]) next.push([s[0], h[0]]);
      if (h[1] < s[1]) next.push([h[1], s[1]]);
    });
    out = next;
  });
  return out;
}

  var w = x1-x0, h = y1-y0, d = z1-z0;

  return m;
}

function buildFloor(def, group, andar){
  var lines = {};
  function line(e){
    var k = e.axis + ':' + e.at.toFixed(2);
    if (!lines[k]) lines[k] = {axis:e.axis, at:e.at, solid:[], holes:[]};
    return lines[k];
  }
  def.rooms.forEach(function(r){
    var s = r.sides === undefined ? 'NSWE' : r.sides;
    if (s.indexOf('N') >= 0) line({axis:'z', at:r.z0}).solid.push([r.x0, r.x1]);
    if (s.indexOf('S') >= 0) line({axis:'z', at:r.z1}).solid.push([r.x0, r.x1]);
    if (s.indexOf('W') >= 0) line({axis:'x', at:r.x0}).solid.push([r.z0, r.z1]);
    if (s.indexOf('E') >= 0) line({axis:'x', at:r.x1}).solid.push([r.z0, r.z1]);

    var cor = TIPOS[r.tipo].cor, lift = r.lift || 0;
    var mat = new THREE.MeshLambertMaterial({color:cor});
    var mesh = box(group, r.x0, r.x1, -0.12 + lift, lift, r.z0, r.z1, mat, false);
    var id = r.part || r.id;
    mesh.userData.id = id; floors.push(mesh);
    if (!r.part) rooms[r.id] = {def:r, group:group, andar:andar, meshes:[mesh], base:new THREE.Color(cor)};
    else rooms[id].meshes.push(mesh);
  });
  (def.extra || []).forEach(function(e){ line(e).solid.push([e.from, e.to]); });
  def.openings.forEach(function(o){ line(o).holes.push(o); });

  Object.keys(lines).forEach(function(k){
    var L = lines[k];
    var solid = merge(L.solid);
    subtract(solid, L.holes.map(function(o){ return [o.from, o.to]; })).forEach(function(iv){
      wall(group, L.axis, L.at, iv[0], iv[1], 0, H, matWall, true, T, true);
    });
    L.holes.forEach(function(o){
      if (o.kind === 'door') { wall(group, L.axis, L.at, o.from, o.to, 0, 0.02, matThresh, false, T); }
      else if (o.kind === 'window') { wall(group, L.axis, L.at, o.from, o.to, 0, 0.85, matWall, true); wall(group, L.axis, L.at, o.from, o.to, 0.85, H, matGlass, false, 0.05); }
      else if (o.kind === 'glass') { wall(group, L.axis, L.at, o.from, o.to, 0, 0.45, matWall, true); wall(group, L.axis, L.at, o.from, o.to, 0.45, H, matGlass, false, 0.05); }
      else if (o.kind === 'cobogo') { wall(group, L.axis, L.at, o.from, o.to, 0, 0.85, matWall, true); wall(group, L.axis, L.at, o.from, o.to, 0.85, H, matCobogo, true); }
      else if (o.kind === 'gate') { wall(group, L.axis, L.at, o.from, o.to, 0, H, matGate, false, 0.05); }
    });
  });
}

function select(id, fly){
  if (id) {
    var R = rooms[id];
    if (mode === 'fora' || !R.group.visible) setMode(R.andar === 'Térreo' ? 'terreo' : 'sup', true);
    if (mode === 'both' && R.andar === 'Térreo' && rooms[id].def.x0 >= CASA.x0 && rooms[id].def.z0 >= CASA.z0 - 0.3) setMode('terreo', true);
  }

}

}

function setMode(m, keepCam){

/* toque num cômodo */
var ray = new THREE.Raycaster(), down = null;
canvas.addEventListener('pointerdown', function(e){ down = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointerup', function(e){
  if (!down) return;
  var moved = Math.abs(e.clientX-down.x) + Math.abs(e.clientY-down.y); down = null;
  if (moved > 8 || inside) return;
  var rc = canvas.getBoundingClientRect();
  var p = new THREE.Vector2(((e.clientX-rc.left)/rc.width)*2-1, -((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(p, camera);
  var hit = ray.intersectObjects(floors.filter(function(m){ return m.parent.visible; }), false)[0];
  var id = hit ? hit.object.userData.id : null;
  if (mode === 'fora') { if (id) enterRoom(id); return; }
  select(id === selected ? null : id, false);
});

/* ---------- entrar nos cômodos (vista por dentro, com a casa fechada) ---------- */
var inside = null, tourEl = document.getElementById('tour'), tNome = document.getElementById('tNome');
var ORDEM = ['ent','rec','s2p','corr','sala2','prox','q1','sala','b1','coz','patio','gi','hall','qv','s3','s1','constr','bc','esc','bsu'].filter(function(id){ return rooms[id]; });
function enterRoom(id){
  if (mode !== 'fora') setMode('fora', true);
  var R = rooms[id], r = R.def, fy = R.andar === 'Térreo' ? 0 : FH;
  var rad = Math.min(2.4, Math.max(0.55, Math.min(r.x1 - r.x0, r.z1 - r.z0) / 2 - 0.3));
  var t = new THREE.Vector3((r.x0 + r.x1) / 2, fy + 1.2, (r.z0 + r.z1) / 2);
  var lx = (r.x1 - r.x0) >= (r.z1 - r.z0) ? 0.95 : 0.3, lz = lx > 0.5 ? 0.3 : 0.95;
  var p = new THREE.Vector3(t.x + rad * lx, t.y + 0.3, t.z + rad * lz);
  inside = id; selected = id;
  if (topView) { topView = false; document.getElementById('btnTop').setAttribute('aria-pressed', 'false'); }
  controls.minDistance = 0.01; controls.maxDistance = 400; controls.minPolarAngle = 0;
  camera.fov = 68; camera.near = 0.05; camera.updateProjectionMatrix();
  flyTo(t, p, function(){ if (inside !== id) return; controls.minDistance = 0.25; controls.maxDistance = rad; controls.minPolarAngle = 1.0; });
  tNome.textContent = r.nome + ' · ' + R.andar.toLowerCase();
  tourEl.hidden = false;
  document.getElementById('btnTour').setAttribute('aria-pressed', 'true');
  paint(); fillInfo(id);
}
function leaveRoom(semVoo){
  inside = null; selected = null;
  controls.minDistance = 2; controls.maxDistance = 120; controls.minPolarAngle = 0;
  camera.fov = 38; camera.near = 0.1; camera.updateProjectionMatrix();
  tourEl.hidden = true;
  document.getElementById('btnTour').setAttribute('aria-pressed', 'false');
  paint(); fillInfo(null);
  if (!semVoo) flyTo(homeTarget(), homePos());
}
function passo(n){ var i = ORDEM.indexOf(inside); enterRoom(ORDEM[(i + n + ORDEM.length) % ORDEM.length]); }
document.getElementById('tPrev').addEventListener('click', function(){ passo(-1); });
document.getElementById('tNext').addEventListener('click', function(){ passo(1); });
document.getElementById('tSair').addEventListener('click', function(){ leaveRoom(false); });
document.getElementById('btnTour').addEventListener('click', function(){ if (inside) leaveRoom(false); else enterRoom(rooms.rec ? 'rec' : ORDEM[0]); });
controls.addEventListener('end', function(){
  if (inside || mode !== 'fora' || tween) return;
  if (camera.position.distanceTo(controls.target) > 11) return;
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  var hit = ray.intersectObjects(floors, false)[0];
  if (hit) enterRoom(hit.object.userData.id);
});
// rolar sobre um cômodo, na vista de fora: a câmera vai na direção dele, atravessa a parede e entra
canvas.addEventListener('wheel', function(e){
  if (inside || mode !== 'fora' || e.deltaY >= 0 || tween) return;
  var rc = canvas.getBoundingClientRect();
  var p = new THREE.Vector2(((e.clientX-rc.left)/rc.width)*2-1, -((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(p, camera);
  var hit = ray.intersectObjects(floors, false)[0];
  if (!hit) return;
  controls.target.lerp(new THREE.Vector3(hit.point.x, hit.point.y + 1, hit.point.z), 0.18);
  dirty = true;
  if (camera.position.distanceTo(controls.target) < 13) enterRoom(hit.object.userData.id);
}, {passive:true});

/* tema */
function applyTheme(){
  var cs = getComputedStyle(document.documentElement);
  function v(n, fb){ var s = cs.getPropertyValue(n).trim(); return s || fb; }
  renderer.setClearColor(new THREE.Color(v('--scene', '#DFE6EC')), 1);
  lotMat.color.set(v('--lot', '#CDD6DE'));
  matEdge.color.set(v('--ink', '#14253A') === '#E6EEF5' ? '#0B1522' : '#14253A');
  matGuide.color.set(v('--muted', '#566779'));
  accent.set(v('--accent', '#0B6E8F'));
  paint();
}
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
}
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* tamanho */
var first = true;
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (first) { first = false; controls.target.copy(homeTarget()); camera.position.copy(homePos()); }
  dirty = true;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);

controls.addEventListener('change', function(){ dirty = true; });

var tmp = new THREE.Vector3();
function placeLabels(){
  var w = stage.clientWidth, h = stage.clientHeight;
  marks.forEach(function(o){
    if (inside || !o.group.visible || (mode === 'fora' && (o.group === gT || o.group === gS))) { o.el.hidden = true; return; }
    tmp.copy(o.pos); tmp.y += o.group.position.y; tmp.project(camera);
    if (tmp.z > 1 || tmp.z < -1) { o.el.hidden = true; return; }
    o.el.hidden = false;
    var x = (tmp.x * 0.5 + 0.5) * w, y = (-tmp.y * 0.5 + 0.5) * h;
    o.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-50%)';
  });
}
function ease(k){ return k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2) / 2; }
function frame(now){
  requestAnimationFrame(frame);
  if (tween) {
    var k = tween.d ? Math.min(1, (now - tween.t0) / tween.d) : 1, e = ease(k);
    controls.target.lerpVectors(tween.fromT, tween.toT, e);
    camera.position.lerpVectors(tween.fromP, tween.toP, e);
    if (k >= 1) { var fim = tween.done; tween = null; if (fim) fim(); }
    dirty = true;
  }
  controls.update();
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
  if (showNames) placeLabels();
}

fillInfo(null);
setMode('fora', true);
applyTheme();
resize();
requestAnimationFrame(frame);
})();
</script>
